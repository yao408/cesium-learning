<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>entities vs Primitive 性能对比 - Cesium Demo</title>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Widgets/widgets.css">
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    .panel {
      position: fixed; top: 10px; left: 10px; z-index: 100;
      background: rgba(0,0,0,0.75); border-radius: 8px; padding: 12px;
      color: #fff; font-family: sans-serif; font-size: 13px; min-width: 200px;
    }
    .panel button { border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; margin: 3px; font-size: 13px; }
    .btn-entities { background: #ef4444; color: #fff; }
    .btn-primitive { background: #4ade80; color: #000; }
    .btn-stop { background: #666; color: #fff; }
    .fps { font-size: 28px; font-weight: bold; margin: 8px 0; }
    .fps.good { color: #4ade80; }
    .fps.bad { color: #ef4444; }
    .label { color: #aaa; font-size: 11px; }
    .points { font-size: 12px; color: #aaa; }
    .points input { width: 60px; background: #333; color: #fff; border: 1px solid #555; border-radius: 3px; padding: 2px 6px; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="panel">
    <div class="label">点数量</div>
    <div class="points"><input type="number" id="count" value="1000" min="100" max="10000" step="100"> 个</div>
    <div class="fps" id="fps">--</div>
    <div class="label" id="modeLabel">FPS</div>
    <button class="btn-entities" onclick="runEntities()">🐢 entities（红色）</button>
    <button class="btn-primitive" onclick="runPrimitive()">🚀 Primitive（绿色）</button>
    <button class="btn-stop" onclick="stop()">⏹ 停止</button>
  </div>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Cesium.js"></script>
  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJhNWE1M2JjZS01ZDhhLTQ0ODctYWIxNi04NWE3MmZjNTFkZTkiLCJpZCI6NDQ4MDg0LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODIyMTY0MzN9.L-8hfjm1CF8tP5x_GR3kd49lvrxBKGpO9ruCd8L6XkE'
    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false, timeline: false, baseLayerPicker: false,
      geocoder: false, homeButton: false, navigationHelpButton: false, sceneModePicker: false,
      imageryProvider: new Cesium.OpenStreetMapImageryProvider({
        url: 'https://tile.openstreetmap.org/',
      }),
    })
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(104.08, 31.57, 15000),
      duration: 1,
    })

    let entities = [], primitive = null, postRenderHandler = null
    let fpsFrameCount = 0, fpsLastTime = performance.now()

    const CENTER_LON = 104.08, CENTER_LAT = 31.57

    function generatePoints(count) {
      const pts = []
      for (let i = 0; i < count; i++) {
        pts.push({
          lon: CENTER_LON + (Math.random() - 0.5) * 0.8,
          lat: CENTER_LAT + (Math.random() - 0.5) * 0.6,
        })
      }
      return pts
    }

    function startFPS() {
      fpsFrameCount = 0; fpsLastTime = performance.now()
      postRenderHandler = viewer.scene.postRender.addEventListener(() => {
        fpsFrameCount++
        const now = performance.now()
        if (now - fpsLastTime >= 1000) {
          const fps = fpsFrameCount
          document.getElementById('fps').textContent = fps
          document.getElementById('fps').className = 'fps ' + (fps >= 30 ? 'good' : 'bad')
          fpsFrameCount = 0; fpsLastTime = now
        }
      })
    }

    function clearAll() {
      entities.forEach(e => viewer.entities.remove(e))
      entities = []
      if (primitive) { viewer.scene.primitives.remove(primitive); primitive = null }
      if (postRenderHandler) { postRenderHandler(); postRenderHandler = null }
    }

    function runEntities() {
      clearAll()
      document.getElementById('modeLabel').textContent = 'entities 模式'
      const count = parseInt(document.getElementById('count').value) || 1000
      startFPS()
      const points = generatePoints(count)
      points.forEach(p => {
        entities.push(viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(p.lon, p.lat),
          point: { pixelSize: 8, color: Cesium.Color.fromCssColorString('#ef4444') },
        }))
      })
    }

    function runPrimitive() {
      clearAll()
      document.getElementById('modeLabel').textContent = 'Primitive 模式'
      const count = parseInt(document.getElementById('count').value) || 1000
      startFPS()
      const points = generatePoints(count)
      const collection = viewer.scene.primitives.add(new Cesium.PointPrimitiveCollection())
      points.forEach(p => {
        collection.add({
          position: Cesium.Cartesian3.fromDegrees(p.lon, p.lat),
          pixelSize: 8, color: Cesium.Color.fromCssColorString('#4ade80'),
        })
      })
      primitive = collection
    }

    window.stop = function() {
      clearAll()
      document.getElementById('fps').textContent = '--'
      document.getElementById('fps').className = 'fps'
      document.getElementById('modeLabel').textContent = 'FPS'
    }
    window.runEntities = runEntities
    window.runPrimitive = runPrimitive
  </script>
</body>
</html>
